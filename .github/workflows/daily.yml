name: Daily Stock Screening

on:
  schedule:
    # UTC 07:10 = KST 16:10 (한국 장 마감 후)
    - cron: '10 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python daily_screener.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results.json history/ || true
          git diff --staged --quiet || git commit -m "Update results $(date +'%Y-%m-%d %H:%M')"
          git push
