<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>내일주식</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #0f1115;
    color: #e8e8ea;
    padding: env(safe-area-inset-top) 16px 40px;
  }
  header {
    padding: 20px 0 12px;
    border-bottom: 1px solid #2a2d35;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta { font-size: 13px; color: #8a8f98; }
  .disclaimer {
    margin-top: 12px;
    font-size: 12px;
    color: #f0b429;
    background: #2a2210;
    border-radius: 8px;
    padding: 10px 12px;
    line-height: 1.5;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 24px 0 4px;
  }
  .section-desc { font-size: 12px; color: #8a8f98; margin-bottom: 8px; }
  .card {
    background: #1a1d24;
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card .name { font-size: 16px; font-weight: 600; }
  .card .code { font-size: 12px; color: #8a8f98; margin-top: 2px; }
  .card .market {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #2a2d35;
    color: #b8bcc4;
    margin-left: 6px;
  }
  .metrics { text-align: right; }
  .metrics .primary { font-size: 16px; font-weight: 700; }
  .primary.red { color: #ff5c5c; }
  .primary.blue { color: #5c9dff; }
  .metrics .sub { font-size: 12px; color: #8a8f98; margin-top: 2px; }
  .empty { text-align: center; color: #8a8f98; padding: 24px 0; font-size: 13px; }
  .refresh {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #2a2d35;
    color: #e8e8ea;
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>
    <h1>📈 내일주식</h1>
    <div class="meta" id="meta">불러오는 중...</div>
    <div class="disclaimer">
      ⚠️ 이 결과는 예측이 아니라 규칙 기반 스크리닝입니다.
      투자 판단의 근거로 단독 사용하지 마세요.
    </div>
  </header>

  <div class="section-title">🚀 모멘텀 (거래량 급증 + 급등)</div>
  <div class="section-desc" id="momentum-desc"></div>
  <div id="momentum-list"></div>

  <div class="section-title">💰 밸류 (거래량 증가 + 저PER)</div>
  <div class="section-desc" id="value-desc"></div>
  <div id="value-list"></div>

  <button class="refresh" onclick="load()">새로고침</button>

<script>
function renderCards(containerId, items, kind) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  if (!items || items.length === 0) {
    el.innerHTML = '<div class="empty">조건을 만족하는 종목이 없습니다.</div>';
    return;
  }
  items.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    if (kind === 'momentum') {
      card.innerHTML = `
        <div>
          <div class="name">${r.name}<span class="market">${r.market}</span></div>
          <div class="code">${r.code}</div>
        </div>
        <div class="metrics">
          <div class="primary red">+${r.price_change_pct}%</div>
          <div class="sub">거래량 ${r.volume_ratio}배 · 점수 ${r.score}</div>
        </div>`;
    } else {
      card.innerHTML = `
        <div>
          <div class="name">${r.name}<span class="market">${r.market}</span></div>
          <div class="code">${r.code}</div>
        </div>
        <div class="metrics">
          <div class="primary blue">PER ${r.per}</div>
          <div class="sub">거래량 ${r.volume_ratio}배 · PBR ${r.pbr} · 점수 ${r.score}</div>
        </div>`;
    }
    el.appendChild(card);
  });
}

async function load() {
  const metaEl = document.getElementById('meta');
  metaEl.textContent = '불러오는 중...';

  try {
    const res = await fetch('results.json?t=' + Date.now());
    const data = await res.json();

    metaEl.textContent = `업데이트: ${data.generated_at} · 스캔 ${data.scanned_count}개 종목`;

    document.getElementById('momentum-desc').textContent =
      `거래량 ${data.momentum_conditions.volume_surge_ratio}배↑, 등락률 ${data.momentum_conditions.price_change_min_pct}%↑`;
    document.getElementById('value-desc').textContent =
      `거래량 ${data.value_conditions.volume_ratio_min}배↑, PER ${data.value_conditions.per_max}↓ (0 초과)`;

    renderCards('momentum-list', data.momentum_results, 'momentum');
    renderCards('value-list', data.value_results, 'value');
  } catch (e) {
    metaEl.textContent = '결과를 아직 불러올 수 없습니다. 잠시 후 다시 시도하세요.';
  }
}
load();
</script>
</body>
</html>
